<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Suminmom Promo</title>
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:url(assets/fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;src:url(assets/fonts/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;src:url(assets/fonts/Pretendard-SemiBold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;src:url(assets/fonts/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format('woff2')}
@font-face{font-family:'Batang';font-weight:400;src:url(assets/fonts/GowunBatang-Regular.woff2) format('woff2')}
@font-face{font-family:'Batang';font-weight:700;src:url(assets/fonts/GowunBatang-Bold.woff2) format('woff2')}
@font-face{font-family:'Corm';font-style:italic;font-weight:500;src:url(assets/fonts/CormorantGaramond-Italic.woff2) format('woff2')}
:root{--W:1920px;--H:1080px;--cream:#FBF6EE;--ivory:#F5EDE1;--sand:#E9DCC7;--gold:#B0854F;--gold2:#CDA86E;--brown:#3D3029;--brown2:#6E5C50;--rose:#D58C84;--blush:#F3D7CF;
  --sage:#6F9470;--sky:#8FB0C6;--ink:#2E2520;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--cream);
  font-family:'Pretendard',sans-serif;color:var(--brown);letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.layer{position:absolute;left:0;top:0;width:var(--W);height:var(--H)}
.scene{position:absolute;left:0;top:0;width:var(--W);height:var(--H);display:none;overflow:hidden}
.a{position:absolute}
.serif{font-family:'Batang',serif}
.en{font-family:'Corm',serif;font-style:italic;font-weight:500;color:var(--gold);letter-spacing:.01em}
.kick{font-family:'Corm',serif;font-style:italic;font-weight:500;font-size:40px;color:var(--gold)}
.ph{position:absolute;overflow:hidden;border-radius:28px;background:#eee;box-shadow:0 26px 60px rgba(70,45,25,.22),0 0 0 8px #fff}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 50%}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;background:#fff;border:2px solid var(--sand);
  font-weight:700;font-size:28px;color:var(--brown);white-space:nowrap;box-shadow:0 8px 20px rgba(80,50,30,.08)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--rose)}
.price{font-weight:800;letter-spacing:-.02em;color:var(--brown)}
.price small{font-size:.5em;font-weight:700;margin-left:4px}

/* map overlays */
#map{filter:brightness(1.08) saturate(1.3) contrast(1.03)}
#vignette{background:radial-gradient(ellipse at center,rgba(255,248,242,0) 52%,rgba(255,242,234,.34) 100%);pointer-events:none}
#attr{right:28px;bottom:18px;font-size:15px;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000;font-weight:500}
#brand{right:56px;top:44px;display:flex;align-items:center;gap:14px;padding:10px 24px 10px 20px;border-radius:999px;background:rgba(251,246,238,.88);
  box-shadow:0 6px 18px rgba(60,40,20,.12)}
#brand b{font-family:'Batang',serif;font-weight:700;font-size:28px;color:var(--brown)}
#brand span{font-size:15px;font-weight:700;letter-spacing:.28em;color:var(--gold);padding-left:14px;border-left:2px solid var(--sand)}
.cpin{left:0;top:0}
.cp-dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--brown2)}
.cp-label{position:absolute;left:20px;top:-22px;font-size:34px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 3px #000}
.spin{left:0;top:0}
.sp-dot{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--rose);box-shadow:0 0 22px rgba(255,190,180,.95)}
.sp-ring{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:3px solid #fff}
.sp-label{position:absolute;left:30px;top:-30px;font-size:40px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 3px #000}
.sp-label small{display:block;font-size:24px;font-weight:600;color:#ffe3dc}
.bpin{left:0;top:0}
.bp-halo{position:absolute;left:-210px;top:-210px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,190,0) 30%,rgba(255,200,190,.32) 62%,rgba(255,200,190,0))}
.bp-shadow{position:absolute;left:-30px;top:-10px;width:60px;height:20px;border-radius:50%;background:rgba(90,50,40,.45)}
.bp-ring{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;border:4px solid #fff}
.bp-pin{position:absolute;left:-42px;top:-114px;width:84px;height:114px}
.bp-card{position:absolute;left:76px;top:-250px;width:640px;padding:28px 36px 30px;border-radius:26px;background:rgba(251,246,238,.97);color:var(--brown);
  border-left:12px solid var(--rose);box-shadow:0 22px 56px rgba(0,0,0,.45)}
.bp-k{font-size:19px;font-weight:800;letter-spacing:.26em;color:var(--rose)}
.bp-name{font-family:'Batang',serif;font-size:62px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.bp-bld{font-size:32px;font-weight:800;margin-top:8px;color:var(--brown)}
.bp-area{font-size:25px;font-weight:600;margin-top:6px;color:var(--brown2)}
#hud{left:80px;top:72px;width:580px;padding:26px 32px;border-radius:24px;background:rgba(251,246,238,.92);color:var(--brown);box-shadow:0 18px 44px rgba(90,50,30,.22)}
.hud-k{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:.24em;color:var(--rose)}
.hud-k i{width:12px;height:12px;border-radius:50%;background:var(--rose);box-shadow:0 0 10px var(--rose)}
.hud-name{font-family:'Batang',serif;font-size:56px;font-weight:700;margin-top:8px}
.hud-coord{font-size:22px;font-weight:600;color:var(--brown2);margin-top:4px;letter-spacing:.04em}
.hud-alt{display:flex;align-items:baseline;gap:16px;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--sand)}
.hud-alt span{font-size:18px;font-weight:700;letter-spacing:.2em;color:var(--brown2)}
.hud-alt b{font-size:40px;font-weight:800}

/* intro */
#intro .bg{left:0;top:0;width:var(--W);height:var(--H);background:radial-gradient(ellipse at 50% 38%,#FFFDF8 0%,#FBF3E6 45%,#F1E3CE 100%)}
.bokeh{position:absolute;left:0;top:0;border-radius:50%}
.petal{position:absolute;left:0;top:0;width:22px;height:14px;border-radius:70% 0 70% 0;background:var(--blush)}
#intro .top{left:0;top:250px;width:var(--W);text-align:center}
#intro .ien{font-size:50px}
#intro .wm{font-family:'Batang',serif;font-weight:700;font-size:180px;line-height:1.05;color:var(--brown);letter-spacing:.12em;text-indent:.12em}
#intro .line{margin:26px auto 0;width:420px;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
#intro .isub{margin-top:26px;font-size:28px;font-weight:700;letter-spacing:.34em;text-indent:.34em;color:var(--brown2)}
#intro .head{left:0;top:600px;width:var(--W);text-align:center;font-family:'Batang',serif;font-weight:700;line-height:1.3;letter-spacing:-.02em}
#intro .ln{overflow:hidden}
#intro .ln span{display:inline-block}
#intro .ln{font-size:64px;height:92px;color:var(--brown2)}
#intro .ln:last-child{font-size:104px;height:142px}
#intro .ln:last-child span{background:linear-gradient(90deg,#B0854F,#D58C84 55%,#B0854F);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro .foot{left:0;top:900px;width:var(--W);text-align:center;font-size:44px}

/* occasions */
#occasions .bg{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(180deg,#FBF6EE 0%,#F4EADC 100%)}
#occasions .hd{left:0;top:96px;width:var(--W);text-align:center}
#occasions .hd .t{font-family:'Batang',serif;font-weight:700;font-size:80px;margin-top:6px}
.occ{position:absolute;top:330px;width:270px;text-align:center}
.occ .ph{position:relative;width:270px;height:270px;border-radius:135px}
.occ .ol{font-family:'Batang',serif;font-weight:700;font-size:38px;margin-top:34px;white-space:nowrap}
.occ .oe{font-size:26px;margin-top:2px}
#occasions .cap{left:0;top:800px;width:var(--W);text-align:center;font-size:38px;font-weight:700}
#occasions .cap2{left:0;top:862px;width:var(--W);text-align:center;font-size:32px;font-weight:500;color:var(--brown2)}

/* dol */
#dol .bg{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(160deg,#FFF8F3 0%,#FBEDE6 55%,#F6E2D8 100%)}
#dol .txt{left:120px;top:110px;width:860px}
#dol .t{font-family:'Batang',serif;font-weight:700;font-size:124px;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
#dol .d{font-size:36px;font-weight:600;line-height:1.55;margin-top:22px;color:var(--brown2)}
#dol .chips{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
#dol .chip{font-size:25px;padding:11px 20px;gap:9px}
#dol .note{font-size:24px;font-weight:600;color:var(--brown2);margin-top:18px;opacity:.9}
.swatch{left:1010px;top:96px;width:800px;height:540px;border-radius:26px;overflow:hidden;
  background:radial-gradient(circle at 3px 3px,rgba(255,255,255,.95) 1.6px,rgba(0,0,0,0) 2.2px) 0 0/7px 7px,
  radial-gradient(circle at 3px 3px,rgba(180,160,140,.18) 2.6px,rgba(0,0,0,0) 3.2px) 3px 3px/7px 7px,#F7F1E8;
  box-shadow:0 30px 70px rgba(90,55,35,.22),inset 0 0 60px rgba(160,130,100,.12)}
.swatch .band{position:absolute;left:0;width:800px;height:16px;background:#7FA2BE;opacity:.85}
.swatch .dobby{position:absolute;left:0;top:452px;width:800px;height:88px;background:repeating-linear-gradient(90deg,rgba(150,125,100,.16) 0 3px,rgba(0,0,0,0) 3px 9px),#F1E8DB}
.swatch svg{position:absolute;left:0;top:0}
.needle{position:absolute;left:0;top:0;width:70px;height:70px}
.marq{left:0;top:700px;width:var(--W);height:320px}
.marq .ph{top:10px;width:280px;height:280px;border-radius:24px;box-shadow:0 18px 40px rgba(90,55,35,.2),0 0 0 6px #fff}

/* quality */
#quality .bg{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(180deg,#F8F1E6,#EFE3D1)}
#quality .bg2{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(180deg,#F1F5EC,#DFE9D8)}
#quality .leaf{left:-120px;top:-80px;width:900px;height:1240px;opacity:.12;color:var(--sage)}
.qpanel{left:930px;top:120px;width:880px}
.qpanel .t{font-family:'Batang',serif;font-weight:700;font-size:76px;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.qpanel .s{font-size:32px;font-weight:600;color:var(--brown2);margin-top:14px}
.trow{display:flex;align-items:center;height:96px;margin-top:14px;padding:0 34px;border-radius:22px;background:rgba(255,255,255,.9);box-shadow:0 10px 26px rgba(90,60,30,.08)}
.trow:first-of-type{margin-top:40px}
.trow .sp{font-size:36px;font-weight:800;width:300px}
.trow .gw{font-size:34px;font-weight:700;color:var(--brown2);width:120px}
.trow .tg{display:inline-block;font-size:22px;font-weight:800;color:#fff;background:var(--sage);padding:5px 14px;border-radius:10px;margin-right:auto}
.trow .tg.no{background:transparent}
.trow .nt{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:28px;font-weight:700;color:var(--brown2);white-space:nowrap}
.trow .bd{font-size:20px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--rose);padding:5px 12px;border-radius:10px}
.bgrid{display:grid;grid-template-columns:420px 420px;gap:26px;margin-top:44px}
.bcell{height:200px;border-radius:26px;background:rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(50,80,40,.10);padding:28px 34px}
.bcell .n{font-size:84px;font-weight:900;line-height:1;color:var(--sage);letter-spacing:-.03em}
.bcell .n em{font-style:normal;font-size:40px;font-weight:800;margin-left:6px}
.bcell .n.w{font-family:'Batang',serif;font-size:66px;font-weight:700;padding-top:10px}
.bcell .l{font-size:30px;font-weight:700;margin-top:18px;color:var(--brown)}

/* gift title */
#giftTitle .bg{left:0;top:0;width:var(--W);height:var(--H);background:radial-gradient(ellipse at 50% 30%,#FFFBF4 0%,#F7EBDA 60%,#EED9BF 100%)}
#giftTitle .hd{left:0;top:120px;width:var(--W);text-align:center}
#giftTitle .k{font-size:56px}
#giftTitle .t{font-family:'Batang',serif;font-weight:700;font-size:170px;line-height:1.1;letter-spacing:.06em;text-indent:.06em}
#giftTitle .s{font-size:36px;font-weight:600;color:var(--brown2);margin-top:12px}
#giftTitle .ph{width:360px;height:360px}

/* sig */
#sig .bg{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(120deg,#FBF4E8 0%,#F5E8D3 100%)}
#sig .hero{left:110px;top:150px;width:780px;height:780px;border-radius:34px}
#sig .txt{left:990px;top:120px;width:840px}
#sig .t{font-family:'Batang',serif;font-weight:700;font-size:96px;line-height:1.12;margin-top:2px;letter-spacing:-.02em}
#sig .comp{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:34px;font-weight:800}
#sig .comp b{padding:8px 18px;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(90,60,30,.08)}
#sig .comp em{font-style:normal;color:var(--gold);font-weight:700}
#sig .pr{font-family:'Batang',serif;font-weight:700;font-size:42px;color:var(--brown2);margin-top:30px;padding-left:22px;border-left:5px solid var(--gold2)}
#sig .items{left:990px;top:575px;display:flex;gap:34px}
.item{width:250px;text-align:center}
.item .ph{position:relative;margin:0 auto;width:190px;height:190px;border-radius:95px;box-shadow:0 14px 30px rgba(90,60,30,.18),0 0 0 6px #fff}
.item .n{font-size:28px;font-weight:800;margin-top:22px;white-space:nowrap}
.item .s{font-size:22px;font-weight:600;color:var(--brown2);margin-top:4px;white-space:nowrap}
#sig .more{left:990px;top:900px;width:820px;height:120px;border-radius:24px;background:#fff;box-shadow:0 14px 34px rgba(90,60,30,.12);display:flex;align-items:center;gap:24px;padding:0 30px 0 14px}
#sig .more .ph{position:relative;width:92px;height:92px;border-radius:18px;box-shadow:none;flex:none}
#sig .more .mk{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:.06em}
#sig .more .mn{font-size:30px;font-weight:800;margin-top:2px}
#sig .more .mp{margin-left:auto;font-size:24px;font-weight:800;color:var(--brown);padding:10px 20px;border-radius:999px;background:var(--blush);white-space:nowrap}

/* card rows (prem / towelSets) */
.crow .bg{left:0;top:0;width:var(--W);height:var(--H)}
.crow .hd{left:0;top:76px;width:var(--W);text-align:center}
.crow .hd .t{font-family:'Batang',serif;font-weight:700;font-size:66px;margin-top:4px}
.gcard{position:absolute;top:262px;width:520px}
.gcard .ph{position:relative;width:520px;height:520px}
.gcard .n1{font-size:34px;font-weight:800;margin-top:34px;white-space:nowrap}
.gcard .n2{font-size:26px;font-weight:600;color:var(--brown2);margin-top:6px;white-space:nowrap}
.gcard .pr{position:absolute;right:-6px;top:-22px;padding:12px 26px;border-radius:999px;background:var(--brown);color:#fff;font-size:34px;font-weight:800;box-shadow:0 10px 24px rgba(40,25,15,.3);z-index:2}

/* condolence */
#condol .bg{left:0;top:0;width:var(--W);height:var(--H);background:radial-gradient(ellipse at 30% 40%,#3a3431 0%,#211d1b 55%,#141211 100%)}
#condol .flw{left:1380px;top:520px;width:700px;height:700px;opacity:.10;color:#fff}
#condol .hero{left:130px;top:170px;width:720px;height:720px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px rgba(255,255,255,.9)}
#condol .txt{left:950px;top:150px;width:860px;color:#fff}
#condol .kick{color:#d9cfc6}
#condol .t{font-family:'Batang',serif;font-weight:700;font-size:78px;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
#condol .s{font-size:32px;font-weight:500;color:#cbbfb5;margin-top:16px}
#condol .lst{margin-top:40px}
#condol .li{display:flex;align-items:center;gap:20px;font-size:38px;font-weight:700;height:78px;border-bottom:1.5px solid rgba(255,255,255,.12)}
#condol .li svg{width:38px;height:38px;flex:none;color:#e8c9a4}
#condol .pr{font-family:'Batang',serif;font-weight:700;font-size:38px;color:#ead8c6;margin-top:44px}

/* location overlays */
#locIntro .shade{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(90deg,rgba(251,246,238,.94) 0%,rgba(251,246,238,.82) 34%,rgba(251,246,238,0) 58%)}
#locIntro .txt{left:120px;top:300px;color:var(--brown)}
#locIntro .kick{color:var(--rose);font-family:'Pretendard';font-style:normal;font-weight:800;font-size:26px;letter-spacing:.3em}
#locIntro .t{font-family:'Batang',serif;font-weight:700;font-size:104px;line-height:1.18;margin-top:18px;letter-spacing:-.02em}
#locIntro .s{font-size:36px;font-weight:600;color:var(--brown2);margin-top:26px}
#locInfo .bar{left:120px;top:850px;width:1680px;height:150px;border-radius:30px;background:rgba(251,246,238,.95);box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;align-items:center}
.li3{flex:1;display:flex;align-items:center;gap:24px;padding:0 44px;height:96px;border-left:2px solid var(--sand)}
.li3:first-child{border-left:none}
.li3 .ic{width:76px;height:76px;border-radius:22px;background:var(--blush);color:var(--brown);display:flex;align-items:center;justify-content:center;flex:none}
.li3 .ic svg{width:46px;height:46px}
.li3 .lt{font-size:36px;font-weight:800;white-space:nowrap}
.li3 .ls{font-size:24px;font-weight:600;color:var(--brown2);margin-top:2px;white-space:nowrap}

/* benefits */
#benefits .bg{left:0;top:0;width:var(--W);height:var(--H);background:linear-gradient(180deg,#FFF7F2 0%,#F8E6DD 100%)}
#benefits .hd{left:0;top:96px;width:var(--W);text-align:center}
#benefits .hd .t{font-family:'Batang',serif;font-weight:700;font-size:84px;margin-top:4px}
.bcard{position:absolute;top:330px;width:380px;height:400px;border-radius:34px;background:#fff;box-shadow:0 26px 60px rgba(120,60,40,.14);text-align:center;padding-top:44px}
.bcard .bi{margin:0 auto;width:120px;height:120px;border-radius:36px;background:var(--blush);display:flex;align-items:center;justify-content:center;color:var(--brown)}
.bcard .bi svg{width:70px;height:70px}
.bcard .bk{font-size:20px;font-weight:800;letter-spacing:.24em;color:var(--rose);margin-top:30px}
.bcard .bt{font-family:'Batang',serif;font-weight:700;font-size:54px;margin-top:10px;white-space:nowrap}
.bcard .bs{font-size:30px;font-weight:700;color:var(--brown2);margin-top:6px}
#benefits .ex{left:0;top:810px;width:var(--W);text-align:center}
#benefits .ex .exk{font-size:28px;font-weight:700;color:var(--brown2)}
#benefits .ex .exr{display:flex;justify-content:center;gap:14px;margin-top:20px}
#benefits .ex .chip{font-size:26px}

/* outro */
